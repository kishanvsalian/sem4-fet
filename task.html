<!DOCTYPE html>
<html>
    <head>
        <title>KVSanime.tv</title>
        <style>
            #k{
                color: azure;
                font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
                border-bottom: 2px solid #e94560;
                padding-bottom: 10px;
                margin-bottom: 5px;
            }
            body{
                background-color: #1a1a2e;
                color: azure;
                margin: 0;
                padding: 20px;
            }
            .thumb{
                cursor: pointer;
                border: 3px solid #0f3460;
                border-radius: 8px;
                transition: transform 0.2s, border-color 0.2s;
                display: block;
            }
            .thumb:hover{
                transform: scale(1.05);
                border-color: #e94560;
            }
            .anime-block{
                background-color: #16213e;
                padding: 15px;
                margin-bottom: 20px;
                border-radius: 10px;
                width: 420px;
                border-left: 4px solid #e94560;
            }
            h1{
                color: azure;
                font-family: 'Lucida Sans', Geneva, Verdana, sans-serif;
                border-bottom: 2px solid #e94560;
                padding-bottom: 10px;
            }
            h2{
                color: #e94560;
                font-family: 'Lucida Sans', Geneva, Verdana, sans-serif;
            }
            h3{
                color: azure;
                font-family: 'Lucida Sans', Geneva, Verdana, sans-serif;
                margin-top: 0;
            }
            .badge{
                background: #e94560;
                color: white;
                font-size: 11px;
                padding: 2px 8px;
                border-radius: 20px;
                margin-left: 8px;
                font-family: 'Lucida Sans', Geneva, Verdana, sans-serif;
            }
            .play-hint{
                color: #aaa;
                font-size: 12px;
                margin-top: 6px;
                font-family: 'Lucida Sans', Geneva, Verdana, sans-serif;
            }
        </style>
    </head>
    <body>
        <h1>🎌 KVSanime.tv</h1>
        <h2>Latest Anime <span class="badge">NEW</span></h2>

        <!-- Attack on Titan -->
        <div class="anime-block">
            <h3>⚔️ Attack on Titan - Episode 1</h3>
            <img class="thumb"
                 src="https://img.youtube.com/vi/QjJ4iPOQF_Y/0.jpg"
                 width="390"
                 onclick="this.outerHTML='<iframe width=390 height=220 src=https://www.youtube.com/embed/QjJ4iPOQF_Y?autoplay=1 allowfullscreen style=border-radius:8px></iframe>'">
            <p class="play-hint">▶ Click to play</p>
        </div>

        <!-- One Punch Man -->
        <div class="anime-block">
            <h3>👊 One Punch Man - Episode 1</h3>
            <img class="thumb"
                 src="https://img.youtube.com/vi/sl8LwAqFOvo/0.jpg"
                 width="390"
                 onclick="this.outerHTML='<iframe width=390 height=220 src=https://www.youtube.com/embed/sl8LwAqFOvo?autoplay=1 allowfullscreen style=border-radius:8px></iframe>'">
            <p class="play-hint">▶ Click to play</p>
        </div>

        <!-- Mushoku Tensei -->
        <div class="anime-block">
            <h3>🌀 Mushoku Tensei - Episode 1</h3>
            <img class="thumb"
                 src="https://img.youtube.com/vi/AA4wS4ihu-8/0.jpg"
                 width="390"
                 onclick="this.outerHTML='<iframe width=390 height=220 src=https://www.youtube.com/embed/AA4wS4ihu-8?autoplay=1 allowfullscreen style=border-radius:8px></iframe>'">
            <p class="play-hint">▶ Click to play</p>
        </div>

    </body>
</html>
